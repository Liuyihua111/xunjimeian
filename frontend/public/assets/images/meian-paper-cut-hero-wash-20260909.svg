        <use href="#straight-architectural-edge" stroke-width="260" opacity=".105"/>
        <use href="#straight-architectural-edge" stroke-width="220" opacity=".12"/>
        <use href="#straight-architectural-edge" stroke-width="180" opacity=".14"/>
        <use href="#straight-architectural-edge" stroke-width="140" opacity=".16"/>
        <use href="#straight-architectural-edge" stroke-width="100" opacity=".18"/>
        <use href="#straight-architectural-edge" stroke-width="60" opacity=".21"/>
        <use href="#straight-architectural-edge" stroke-width="24" opacity=".27"/>
      </g>
    </mask>
    <linearGradient id="wall-wash" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#cbb687" stop-opacity=".86"/>
      <stop offset=".38" stop-color="#ddcca5" stop-opacity=".72"/>
      <stop offset="1" stop-color="#ede4d2" stop-opacity=".36"/>
    </linearGradient>
    <linearGradient id="roof-wash" x1="0" y1="0" x2="1" y2=".12">
      <stop stop-color="#596c67" stop-opacity=".86"/>
      <stop offset=".48" stop-color="#7f908a" stop-opacity=".74"/>
      <stop offset="1" stop-color="#655f55" stop-opacity=".66"/>
    </linearGradient>
    <linearGradient id="stone-wash" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8b9188" stop-opacity=".65"/>
      <stop offset="1" stop-color="#b5afa0" stop-opacity=".26"/>
    </linearGradient>
    <linearGradient id="paper-depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".72" stop-color="#fff"/>
      <stop offset=".94" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="bottom-clear" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="260" style="mask-type:alpha">
      <path d="M0 0H1600V260H0Z" fill="url(#paper-depth)"/>
