<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 260">
  <defs>
    <path id="paper-shape" d="M0 260V259L175 252L246 224V101H236V84H258V58H1170V86H1348V101H1361V224L1428 247L1600 259V260Z"/>
    <path id="straight-architectural-edge" d="M0 259L175 252L246 224V101H236V84H258V58H1170V86H1348V101H1361V224L1428 247L1600 259"/>
    <clipPath id="paper-clip"><use href="#paper-shape"/></clipPath>
    <filter id="watercolor-paper" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".011 .075" numOctaves="2" seed="17" result="paper-noise"/>
      <feDisplacementMap in="SourceGraphic" in2="paper-noise" scale="1.8" xChannelSelector="R" yChannelSelector="G" result="soft-edge"/>
      <feGaussianBlur in="soft-edge" stdDeviation=".42"/>
    </filter>
    <filter id="fade-soften" x="-10%" y="-65%" width="120%" height="230%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
    <mask id="pattern-inward-fade" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="260" style="mask-type:alpha">
