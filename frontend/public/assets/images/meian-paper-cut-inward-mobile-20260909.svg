    </mask>
    <linearGradient id="paper-join" gradientUnits="userSpaceOnUse" x1="0" y1="178" x2="0" y2="245">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="bottom-fade" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="260" style="mask-type:alpha">
      <path d="M0 0h900v260H0Z" fill="url(#paper-join)"/>
    </mask>
