<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260">
  <defs>
    <clipPath id="paper-clip"><use href="#paper-foundation"/></clipPath>
    <radialGradient id="pine">
      <stop stop-color="#687F74" stop-opacity=".6"/>
      <stop offset=".4" stop-color="#687F74" stop-opacity=".32"/>
      <stop offset="1" stop-color="#687F74" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mist">
      <stop stop-color="#AABBB6" stop-opacity=".7"/>
      <stop offset=".46" stop-color="#AABBB6" stop-opacity=".3"/>
      <stop offset="1" stop-color="#AABBB6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moss">
      <stop stop-color="#A8B095" stop-opacity=".58"/>
      <stop offset=".42" stop-color="#A8B095" stop-opacity=".25"/>
      <stop offset="1" stop-color="#A8B095" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ochre">
      <stop stop-color="#B49A77" stop-opacity=".42"/>
      <stop offset=".4" stop-color="#B49A77" stop-opacity=".17"/>
      <stop offset="1" stop-color="#B49A77" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="foot-fade" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".65" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="foot"><path fill="url(#foot-fade)" d="M35 0h830v248H35z"/></mask>
    <filter id="pigment" x="-8%" y="-20%" width="116%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".04 .075" numOctaves="1" seed="29" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="3" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
  </defs>
  <path id="paper-foundation" fill="#f3f1ec" d="M0 260L0 259C37 256 70 244 92 225C110 211 102 168 107 132C111 110 106 103 113 94C124 80 122 62 144 60C230 54 303 65 394 58C474 54 544 65 605 59C627 55 644 54 660 59C675 64 670 78 686 89C710 100 742 93 771 100C796 104 799 115 797 140C794 176 790 205 809 223C833 242 865 255 900 259L900 260Z"/>
  <g clip-path="url(#paper-clip)">
    <g mask="url(#foot)" filter="url(#pigment)">
      <g id="roof-pigment">
        <ellipse fill="url(#pine)" cx="237" cy="55" rx="123" ry="56"/>
        <ellipse fill="url(#mist)" cx="438" cy="58" rx="125" ry="45"/>
        <ellipse fill="url(#pine)" cx="615" cy="55" rx="81" ry="48" opacity=".7"/>
      </g>
      <g id="side-pigment">
        <ellipse fill="url(#mist)" cx="103" cy="139" rx="48" ry="95"/>
        <ellipse fill="url(#moss)" cx="137" cy="85" rx="57" ry="71"/>
        <ellipse fill="url(#moss)" cx="739" cy="95" rx="91" ry="58"/>
        <ellipse fill="url(#mist)" cx="796" cy="164" rx="42" ry="76"/>
      </g>
      <g id="warm-accent">
        <ellipse fill="url(#ochre)" cx="681" cy="87" rx="34" ry="36"/>
      </g>
    </g>
  </g>
</svg>
