  <use id="paper-foundation" fill="#f3f1ec" href="#paper-shape"/>
  <g clip-path="url(#paper-clip)" mask="url(#bottom-clear)">
    <g id="faded-meian-pattern" mask="url(#pattern-inward-fade)">
      <use href="#meian-pattern-card"/>
    </g>
  </g>
</svg>
